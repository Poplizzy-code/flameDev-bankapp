<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlameDev Bank | Sign Up</title>
  <link rel="stylesheet" href="dist/styles.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-400 via-orange-500 to-orange-600">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm">
    <h1 class="text-3xl font-bold text-center text-orange-600 mb-6">FlameDev Bank</h1>
    <p class="text-center text-gray-500 mb-6">Sign up with your email to start banking securely</p>

    <form id="step1Form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Email</label>
        <input type="email" placeholder="you@example.com" id="email" required
          class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" placeholder="********" id="password" required
          class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
      </div>

      <button type="submit"
        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Sign Up</button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Already have an account? <a href="login.html" class="text-orange-600 font-semibold underline">Log In</a>
    </p>
  </div>

<div id="step2Form" class="hidden bg-white rounded-3xl shadow-2xl p-8 w-full max-w-md">
  <h2 class="text-2xl font-bold text-orange-600 mb-6 text-center">Complete Your Profile</h2>
  <form class="space-y-4">
    
    <div>
      <label class="block text-sm font-medium text-gray-700">Full Name</label>
      <input type="text" placeholder="John Doe" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Age</label>
      <input type="number" placeholder="25" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Nationality</label>
      <input type="text" placeholder="Nigerian" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Occupation</label>
      <input type="text" placeholder="Software Developer" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Phone Number</label>
      <input type="tel" placeholder="+234 801 234 5678" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Address</label>
      <input type="text" placeholder="123 Main Street" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Create Password</label>
      <input type="password" placeholder="********" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700">Confirm Password</label>
      <input type="password" placeholder="********" class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500">
    </div>

    <div class="flex items-center">
      <input type="checkbox" id="terms2" class="h-4 w-4 text-orange-600 border-gray-300 rounded focus:ring-orange-500">
      <label for="terms2" class="ml-2 block text-sm text-gray-700">I agree to the <a href="#" class="text-orange-600 underline">Terms & Conditions</a></label>
    </div>

    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors">Complete Sign Up</button>
  </form>
</div>

  <script src="flamedev.js"></script>
</body>
</html>
