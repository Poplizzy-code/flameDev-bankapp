<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BankApp | Login</title>
  <link href="/dist/styles.css" rel="stylesheet" />
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-400 via-orange-500 to-orange-600">

  <div class="bg-white rounded-3xl shadow-2xl p-8 w-full max-w-sm">
    
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-center text-orange-600 mb-6">BankApp</h1>
      <p class="text-center text-gray-500 mb-6">Welcome back 👋</p>
    </div>

    <div class="bg-white rounded-3xl shadow-2xl p-8 sm:p-10">
      <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Login to your account</h2>

      <form id="loginForm" class="space-y-4">      
        <div>
          <label class="block text-sm font-medium text-gray-700">Email Address</label>
          <input
            id="loginEmail"
            type="email"
            placeholder="you@example.com"
            class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700">Password</label>
          <input
            id="loginPassword"
            type="password"
            placeholder="Enter your password"
            class="mt-1 block w-full rounded-lg border border-gray-300 p-2 focus:ring-orange-500 focus:border-orange-500"
          />
        </div>
         <p id="loginError" class="text-red-500 text-sm hidden">Invalid email or password</p>

        <div class="flex justify-end">
          <a href="#" class="text-sm text-blue-600 hover:text-blue-700 font-medium">Forgot password?</a>
        </div>

        <button
          type="submit"
          class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 px-4 rounded-lg transition-colors"
        >
          Login
        </button>
      </form>

      <div class="flex items-center my-6">
        <div class="flex-grow h-px bg-gray-200"></div>
        <span class="px-3 text-sm text-gray-600">OR</span>
        <div class="flex-grow h-px bg-gray-200"></div>
      </div>

      <p class="mt-4 text-center text-sm text-gray-600">
        Don’t have an account?
        <a href="signup.html" class="text-orange-600 font-semibold underline">Sign Up</a>
      </p>
    </div>
  </div>

  <script>
  const loginForm = document.getElementById("loginForm");
  const emailInput = document.getElementById("loginEmail");
  const passwordInput = document.getElementById("loginPassword");
  const errorText = document.getElementById("loginError");

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value.trim();

    if (!email || !password) {
      showError("Please fill in all fields");
      return;
    }

    const users = JSON.parse(localStorage.getItem("bankUsers")) || [];

    if (users.length === 0) {
      showError("No account found. Please sign up.");
      return;
    }

    const user = users.find(u => u.email === email && u.password === password);

    if (user) {
      localStorage.setItem("loggedInUser", JSON.stringify(user));
      localStorage.setItem("isLoggedIn", "true");

      window.location.href = "dashboard.html";
    } else {
      showError("Invalid email or password");
    }
  });

  function showError(message) {
    errorText.textContent = message;
    errorText.classList.remove("hidden");
  }
</script>

</body>
</html>
